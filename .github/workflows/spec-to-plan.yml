name: seula · spec to plan (reusable)

# specs/spec-to-plan-workflow.md. Called from an adopting repo's short caller workflow when a
# pull request is closed. When a spec pull request (a seula/ branch) was merged, the merge
# approved the spec: the workflow marks it Approved, lets Claude write the plan into its
# ## PLAN section with G2 in its loop, and runs G2 with Jev on the result.
#
# Security (criteria 5-6, as in ticket-to-spec): the branch name and the pull request number
# reach the scripts only as environment values. The agent reads only the working directory and
# its skills, edits only the one spec file, can't run git or fetch web pages, and its only
# command is G2; its shell commands don't get credentials, and the repo's own Claude Code
# settings don't load for it. No credential is on disk while it runs.
on:
  workflow_call:
    inputs:
      tracker:
        description: "jira or github"
        type: string
        required: true
      seula-ref:
        description: "The seula version (tag, branch or commit) to run"
        type: string
        default: main
      model:
        description: "Claude model for the planner"
        type: string
        default: opus
      base-branch:
        description: "Branch the spec was merged into, and the plan pull request targets"
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SEULA_GH_TOKEN:
        required: true
      TYPESAFE_API_KEY:
        required: false
      JIRA_BASE_URL:
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read

# bash with pipefail: a failed command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  plan:
    # Criterion 1: only a merged spec pull request from this repo. Otherwise GitHub shows the job
    # as skipped.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'seula/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seula-plan-${{ github.repository }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    env:
      SEULA: node .seula-tool/src/cli.ts
      SEULA_TRACKER: ${{ inputs.tracker }}
      SEULA_MODEL: ${{ inputs.model }}
      BASE_BRANCH: ${{ inputs.base-branch }}
    steps:
      - name: Check the inputs
        run: |
          case "$SEULA_TRACKER" in jira|github) ;; *) echo "::error::tracker must be jira or github"; exit 1 ;; esac
          [[ "$SEULA_MODEL" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::Invalid model"; exit 1; }
          [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid base branch"; exit 1; }

      - name: Check out the repo
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Criterion 2: the base branch after the merge, which holds the approved spec and
          # its run file. A personal token, so the plan pull request (unit 6) triggers CI.
          ref: ${{ inputs.base-branch }}
          token: ${{ secrets.SEULA_GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out seula
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: JJJohansson/seula
          ref: ${{ inputs.seula-ref }}
          path: .seula-tool
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Find the ticket and the spec (criteria 2-3)
        id: find
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid pull request number"; exit 1; }
          # Criterion 2: the key from the branch name, with no tracker call (trackers criterion 17).
          run_id="$($SEULA tracker key --tracker "$SEULA_TRACKER" --branch "$HEAD_REF" | jq -r .runId)"
          # Criterion 3: the pull request's own file list works for merge, squash and rebase
          # merges. Keep the files in the spec directory that still exist, leaving out the
          # config's ignore list (such as the spec index).
          config="$($SEULA config)"
          spec_dir="$(jq -r '.specDir | sub("/+$"; "")' <<< "$config")"
          ignore="$(jq -c '.ignore' <<< "$config")"
          # A file first, so a failed API call fails this step instead of looking like "0 specs".
          files="${RUNNER_TEMP:-.}/pr-files.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > "$files"
          mapfile -t specs < <(
            jq -R -r --arg dir "$spec_dir/" --argjson ignore "$ignore" \
              'select(startswith($dir) and endswith(".md")) | select(. as $f | $ignore | index($f) | not)' < "$files" |
              while IFS= read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done
          )
          if [ "${#specs[@]}" -ne 1 ]; then
            echo "::error::The merged pull request changed ${#specs[@]} specs in $spec_dir; the plan step needs exactly one."
            exit 1
          fi
          spec="${specs[0]}"
          name="${spec##*/}"
          [[ "$name" =~ ^[A-Za-z0-9._-]+\.md$ ]] || { echo "::error::Unexpected spec file name"; exit 1; }
          {
            echo "RUN_ID=$run_id"
            echo "SPEC=$spec"
            echo "APPROVED=.seula/approved/$name"
            echo "PR_NUMBER=$PR_NUMBER"
          } >> "$GITHUB_ENV"
          echo "Plan for $run_id: $spec"

      - name: Keep the approved copy, then approve the spec (criteria 4-5)
        run: |
          # G2 checks the plan against this copy of the spec as merged (--approved). It stays on
          # the runner: no step stages .seula/approved.
          mkdir -p .seula/approved
          cp "$SPEC" "$APPROVED"
          $SEULA approve "$SPEC" --pr "$PR_NUMBER"

      - name: Install Claude Code
        id: install
        run: |
          # As in ticket-to-spec: Claude Code runs every agent command in a bubblewrap sandbox
          # (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1) and won't start without it. socat relays the
          # sandbox's network traffic. From Ubuntu's signed archive, unpinned: an accepted risk in
          # specs/security.md.
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid true ||
            { echo "::error::bubblewrap can't create a sandbox on this runner"; exit 1; }
          # specs/security.md criterion 2: the same exact version as ticket-to-spec (a test checks
          # that the two agree).
          npm install -g @anthropic-ai/claude-code@2.1.274
          claude --version
          mkdir -p "$HOME/.claude/skills"

      - name: Write the plan · Claude with G2 in the loop (criteria 5-6)
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Criterion 6: the agent's shell commands don't get the Anthropic key or other
          # credentials. No Jev key here: the agent's G2 checks the plan rules, and the next step
          # runs G2 with Jev.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          prompt="$($SEULA prompt planner --run "$RUN_ID" --spec "$SPEC" --approved "$APPROVED" --seula-cmd "$SEULA")"
          schema='{"type":"object","properties":{"spec_path":{"type":"string"},"status":{"type":"string","enum":["ready","needs_input","blocked"]},"questions":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["spec_path","status","questions","summary"]}'
          # Criterion 6: reads stay in the working directory and the installed skills; the only
          # edit is the spec file, and the only command is G2. Only user settings load, so the
          # repo's .claude/ files can't add hooks or permissions.
          settings='{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
          set +e
          claude -p "$prompt" \
            --model "$SEULA_MODEL" \
            --max-turns 40 \
            --setting-sources user \
            --permission-mode dontAsk \
            --settings "$settings" \
            --add-dir "$HOME/.claude/skills" \
            --plugin-dir .seula-tool \
            --allowedTools "Skill,Edit($SPEC),Bash($SEULA gate g2 *)" \
            --disallowedTools "WebFetch,WebSearch,Bash(git *)" \
            --output-format json \
            --json-schema "$schema" > claude.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          jq '{is_error, num_turns, total_cost_usd, structured_output}' claude.json || cat claude.json

      - name: G2 · the workflow's own check (criterion 7)
        id: g2
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          # The agent's G2 had no Jev key. This run asks Jev's flag questions and records the
          # result in the run file; the plan pull request (unit 6) reads it.
          set +e
          $SEULA gate g2 "$SPEC" --approved "$APPROVED" --run "$RUN_ID"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 77 ]; then
            echo "::warning::Jev refused TYPESAFE_API_KEY (the repository secret SEULA_TYPESAFE_API_KEY), so G2 could not ask its flag questions."
          elif [ "$code" -ge 64 ]; then
            echo "::warning::G2 could not run (exit $code)."
          fi
