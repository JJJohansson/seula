name: seula · ticket to spec (reusable)

# specs/ticket-to-spec-workflow.md. Called from an adopting repo's short caller workflow
# (written by `seula init`). Reads the ticket from the triggering event, checks it (G0), lets
# Claude write or update the spec with G1 in its loop, opens a pull request, and reports back on
# the ticket.
#
# Security (criteria 5-6, 13-14): no ticket field appears in a run: script. The ticket reaches the
# gates and the agent only as a file written by `seula tracker ticket`. The agent reads only the
# working directory and its skills, edits only the spec directory, can't run git or fetch web
# pages, and its only command is G1; its shell commands don't get credentials. The repo's own
# Claude Code settings, hooks and project skills don't load for it. No credential is
# on disk while it runs. Plain steps do the git and tracker work, each secret is given only to
# the steps that use it, and a secret found in the agent's output stops the run.
on:
  workflow_call:
    inputs:
      tracker:
        description: "jira or github"
        type: string
        required: true
      seula-ref:
        description: "The seula version (tag, branch or commit) to run"
        type: string
        default: main
      model:
        description: "Claude model for the spec writer"
        type: string
        default: opus
      base-branch:
        description: "Branch the pull request targets"
        type: string
        default: main
      sdd-skill-repo:
        description: "Optional owner/repo of a spec-driven-development skill to install for the agent"
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SEULA_GH_TOKEN:
        required: true
      TYPESAFE_API_KEY:
        required: false
      JIRA_BASE_URL:
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seula-${{ github.repository }}-${{ github.event.issue.number || github.event.client_payload.key }}
      cancel-in-progress: false
    env:
      SEULA: node .seula-tool/src/cli.ts
      SEULA_TRACKER: ${{ inputs.tracker }}
      SEULA_MODEL: ${{ inputs.model }}
      BASE_BRANCH: ${{ inputs.base-branch }}
      SDD_SKILL_REPO: ${{ inputs.sdd-skill-repo }}
    steps:
      - name: Check the inputs
        run: |
          case "$SEULA_TRACKER" in jira|github) ;; *) echo "::error::tracker must be jira or github"; exit 1 ;; esac
          [[ "$SEULA_MODEL" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::Invalid model"; exit 1; }
          [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid base branch"; exit 1; }
          [[ -z "$SDD_SKILL_REPO" || "$SDD_SKILL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid sdd-skill-repo"; exit 1; }

      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # A personal token, so the branch and pull request made below trigger CI
          # (pushes made with the default GITHUB_TOKEN don't start other workflows).
          token: ${{ secrets.SEULA_GH_TOKEN }}
          fetch-depth: 0
          # Criterion 6: no credential on disk while the agent runs. The pull request step
          # gives the token to its own git commands.
          persist-credentials: false

      - name: Check out seula
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: JJJohansson/seula
          ref: ${{ inputs.seula-ref }}
          path: .seula-tool
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Read the ticket (criterion 2)
        run: |
          echo ".seula-tool/" >> .git/info/exclude
          $SEULA tracker ticket --tracker "$SEULA_TRACKER" --event "$GITHUB_EVENT_PATH" --out .seula/pending-ticket.md > ticket.json
          run_id="$(jq -r .runId ticket.json)"
          key="$(jq -r .key ticket.json)"
          [[ "$run_id" =~ ^[A-Za-z0-9._-]+$ && "$key" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::Invalid ticket id"; exit 1; }
          tickets_dir="$($SEULA config | jq -r .ticketsDir)"
          runs_dir="$($SEULA config | jq -r .runsDir)"
          spec_dir="$($SEULA config | jq -r .specDir)"
          for dir in "$tickets_dir" "$runs_dir" "$spec_dir"; do
            [[ "$dir" =~ ^[A-Za-z0-9._/-]+$ && "$dir" != *..* ]] || { echo "::error::Invalid directory in seula.config.json: $dir"; exit 1; }
          done
          mkdir -p "$tickets_dir"
          mv .seula/pending-ticket.md "$tickets_dir/$run_id.md"
          {
            echo "RUN_ID=$run_id"
            echo "TICKET_KEY=$key"
            echo "TICKET_FILE=$tickets_dir/$run_id.md"
            echo "RUN_FILE=$runs_dir/$run_id.json"
            echo "SPEC_DIR=${spec_dir%/}"
          } >> "$GITHUB_ENV"
          cat "$tickets_dir/$run_id.md"

      - name: G0 · is the ticket ready? (criterion 3)
        id: g0
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          title="$(jq -r .title ticket.json)"
          set +e
          $SEULA gate g0 --ticket "$TICKET_FILE" --run "$RUN_ID" --title "$title" --json > g0.json
          code=$?
          set -e
          cat g0.json
          $SEULA update --run "$RUN_ID" --ticket-url "$(jq -r .url ticket.json)" || echo "::warning::Ticket link not stored"
          if [ "$code" -ge 64 ]; then echo "::error::seula failed (exit $code)"; exit 1; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Ask on the ticket (G0 did not pass)
        if: steps.g0.outputs.code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          jq -r '"seula · G0: this ticket needs input before a spec can be written.\n\n" + (((.asks // []) + (.notes // [])) | map("- " + .) | join("\n"))' g0.json > comment.md
          $SEULA tracker comment --tracker "$SEULA_TRACKER" --key "$TICKET_KEY" --text-file comment.md
          $SEULA tracker move --tracker "$SEULA_TRACKER" --key "$TICKET_KEY" --state needsInput ||
            echo "::warning::Could not set the ticket to needsInput"

      - name: Find an earlier run for this ticket (criterion 16)
        if: steps.g0.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
        run: |
          # One branch and one pull request per ticket. Reuse the ticket's open pull request
          # branch (also one named by an older seula, seula/<key>-<spec>), else seula/<key>.
          key_lc="$(printf '%s' "$RUN_ID" | tr '[:upper:]' '[:lower:]')"
          branch="seula/$key_lc"
          existing="$(gh pr list --state open --limit 100 --json headRefName |
            jq -r --arg b "$branch" '[.[].headRefName | select(. == $b or startswith($b + "-"))] | first // ""')"
          if [[ "$existing" =~ ^seula/[a-z0-9._-]+$ ]]; then branch="$existing"; fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          # A spec that an earlier run added (not on the base branch) goes back into the
          # working tree, and the agent is told to update it. Only added files, so newer
          # versions of files on the base branch are never replaced.
          previous=""
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              fetch -q origin "refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
            base="$(git merge-base HEAD "origin/$branch")"
            previous="$(git diff --name-only --diff-filter=A "$base" "origin/$branch" -- "$SPEC_DIR" |
              grep -E "^$SPEC_DIR/[a-z0-9][a-z0-9-]*\.md$" | head -n 1 || true)"
            if [ -n "$previous" ]; then
              git checkout "origin/$branch" -- "$previous"
              echo "Earlier draft for $RUN_ID: $previous (from $branch)"
            fi
          fi
          echo "PREVIOUS_SPEC=$previous" >> "$GITHUB_ENV"

      - name: Install Claude Code
        if: steps.g0.outputs.code == '0'
        run: |
          # Criterion 5: with CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1, Claude Code runs every agent
          # command in a bubblewrap sandbox and won't start without it. socat relays the
          # sandbox's network traffic. They come from Ubuntu's signed archive, unpinned: an
          # accepted risk in specs/security.md.
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces. Claude Code's documented profile
          # lets only bwrap create them; the commands it runs stay confined.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid true ||
            { echo "::error::bubblewrap can't create a sandbox on this runner"; exit 1; }
          # specs/security.md criterion 2: an exact version (the "stable" channel), at least
          # 2.1.257 for the agent's permission settings. Bump it by hand after checking them;
          # Dependabot doesn't see global installs.
          npm install -g @anthropic-ai/claude-code@2.1.274
          claude --version
          mkdir -p "$HOME/.claude/skills"
          if [ -n "$SDD_SKILL_REPO" ]; then
            git clone --depth 1 "https://github.com/$SDD_SKILL_REPO" "$HOME/.claude/skills/spec-driven-development"
          fi

      - name: Write the spec · Claude with G1 in the loop (criteria 4-5, 10)
        id: claude
        if: steps.g0.outputs.code == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Criterion 5: the agent's shell commands don't get the Anthropic key or other
          # credentials, and can't read them from /proc. No Jev key here (criterion 6): the
          # agent's G1 checks the format, and the next step runs G1 with Jev (criterion 15).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          # Criterion 16: an earlier run's draft spec is named in the prompt, to be updated.
          previous_args=()
          if [ -n "${PREVIOUS_SPEC:-}" ]; then previous_args=(--previous-spec "$PREVIOUS_SPEC"); fi
          prompt="$($SEULA prompt spec-writer --run "$RUN_ID" --ticket "$TICKET_FILE" --seula-cmd "$SEULA" "${previous_args[@]}")"
          schema='{"type":"object","properties":{"spec_path":{"type":"string"},"status":{"type":"string","enum":["ready","needs_input","blocked"]},"questions":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["spec_path","status","questions","summary"]}'
          # Criterion 5: reads (file tools and commands such as cat) stay in the working
          # directory and the installed skills. Edit rules also cover Write. The only
          # command is G1.
          # Criterion 14: only user sources load, so the repo's .claude/settings*.json, .mcp.json,
          # project skills and subagents can't add hooks, env values or permissions.
          # The sandboxed commands get no network: the agent's G1 has no Jev key, so it needs none.
          settings='{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
          set +e
          claude -p "$prompt" \
            --model "$SEULA_MODEL" \
            --max-turns 40 \
            --setting-sources user \
            --permission-mode dontAsk \
            --settings "$settings" \
            --add-dir "$HOME/.claude/skills" \
            --plugin-dir .seula-tool \
            --allowedTools "Skill,Task,Agent,Edit($SPEC_DIR/**),Bash($SEULA gate g1 *)" \
            --disallowedTools "WebFetch,WebSearch,Bash(git *)" \
            --output-format json \
            --json-schema "$schema" > claude.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          jq '{is_error, num_turns, total_cost_usd, structured_output}' claude.json || cat claude.json

      - name: G1 · the workflow's own check (criteria 8, 15)
        if: steps.g0.outputs.code == '0'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          # Criterion 15: the agent's G1 checks only the format. The workflow runs G1 with Jev on
          # the spec the agent returned, and records it in the run file; criterion 8 reads this
          # result, and its feedback goes on the pull request and the ticket.
          spec="$(jq -r '.structured_output.spec_path // ""' claude.json 2>/dev/null || echo "")"
          name="${spec#"$SPEC_DIR"/}"
          if [[ "$spec" != "$SPEC_DIR"/* || ! "$name" =~ ^[a-z0-9][a-z0-9-]*\.md$ || ! -f "$spec" ]]; then
            echo "No valid spec path from the agent; the next step reports it."
            exit 0
          fi
          set +e
          $SEULA gate g1 "$spec" --run "$RUN_ID" --ticket "$TICKET_FILE"
          code=$?
          set -e
          # back (1), unsure (2) and the loop limit (3) are results. An error leaves the agent's
          # skipped G1 as the last result, so criterion 8 keeps the pull request a draft.
          if [ "$code" -ge 64 ]; then echo "::warning::G1 could not run (exit $code); the pull request stays a draft."; fi

      - name: Read the result (criteria 8, 11)
        id: result
        if: steps.g0.outputs.code == '0'
        env:
          CLAUDE_EXIT: ${{ steps.claude.outputs.code }}
          HAS_JEV: ${{ secrets.TYPESAFE_API_KEY != '' }}
        run: |
          cost="$(jq -r '.total_cost_usd // 0' claude.json 2>/dev/null || echo 0)"
          $SEULA update --run "$RUN_ID" --claude-usd "$cost" || echo "::warning::Cost not stored"
          spec="$(jq -r '.structured_output.spec_path // ""' claude.json 2>/dev/null || echo "")"
          status="$(jq -r '.structured_output.status // ""' claude.json 2>/dev/null || echo "")"
          case "$status" in ready|needs_input|blocked) ;; *) status=blocked ;; esac
          if [ "$CLAUDE_EXIT" != "0" ]; then status=blocked; fi
          case "$spec" in
            "$SPEC_DIR"/*.md) name="${spec#"$SPEC_DIR"/}" ;;
            *) name="" ;;
          esac
          if ! [[ "$name" =~ ^[a-z0-9][a-z0-9-]*\.md$ ]] || [ ! -f "$spec" ]; then
            echo "::error::The agent returned no valid spec path: '$spec'"
            spec=""
            status=blocked
          fi
          # Criterion 16: if the agent wrote another file than the earlier draft, the draft goes,
          # so a pull request never holds two specs for one ticket.
          if [ -n "${PREVIOUS_SPEC:-}" ] && [ -n "$spec" ] && [ "$spec" != "$PREVIOUS_SPEC" ]; then
            echo "::warning::The agent wrote $spec instead of updating $PREVIOUS_SPEC; the earlier draft is removed."
            rm -f -- "$PREVIOUS_SPEC"
          fi
          # Trust the gate record, not the agent's own report. A skipped G1 counts only when no
          # Jev key is configured (criterion 8), so a lost key can't pass silently.
          g1="$(jq -r '[.events[] | select(.gate == "G1")] | last | .result // "none"' "$RUN_FILE")"
          g1_ok=false
          if [ "$g1" = "pass" ]; then g1_ok=true; fi
          if [ "$g1" = "skipped" ] && [ "$HAS_JEV" != "true" ]; then g1_ok=true; fi
          # An unsure G1 with no open questions is for the spec reviewer, not the ticket author.
          if [ "$status" = "ready" ] && [ "$g1" = "review" ]; then
            status=review
          elif [ "$status" = "ready" ] && [ "$g1_ok" != "true" ]; then
            echo "::warning::The agent reported ready, but the last G1 result is '$g1'."
            status=needs_input
          fi
          {
            echo "spec=$spec"
            echo "status=$status"
            echo "g1=$g1"
          } >> "$GITHUB_OUTPUT"

      - name: Check the agent's output for secrets (criterion 13)
        if: steps.g0.outputs.code == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SEULA_GH_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          # Everything that later steps commit or post: the spec directory, the run file and
          # the agent's output. The check names a leaked secret but never prints its value.
          files=("$SPEC_DIR" "$RUN_FILE")
          if [ -f claude.json ]; then files+=(claude.json); fi
          leaked=0
          for name in ANTHROPIC_API_KEY TYPESAFE_API_KEY SEULA_GH_TOKEN JIRA_API_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then continue; fi
            if grep -rqF -- "$value" "${files[@]}" 2>/dev/null; then
              echo "::error::The value of $name appears in the agent's output. Nothing is committed or posted."
              leaked=1
            fi
          done
          exit "$leaked"

      - name: Commit and open the pull request (criterion 7)
        id: pr
        if: steps.g0.outputs.code == '0' && steps.result.outputs.spec != ''
        env:
          GH_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
          SPEC: ${{ steps.result.outputs.spec }}
          STATUS: ${{ steps.result.outputs.status }}
          G1_RESULT: ${{ steps.result.outputs.g1 }}
        run: |
          title="$(jq -r .title ticket.json)"
          # Criterion 16: one branch per ticket, chosen before the agent ran.
          branch="$BRANCH"
          git config user.name "seula[bot]"
          git config user.email "seula-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$SPEC_DIR" "$RUN_FILE" "$TICKET_FILE"
          git commit -m "spec($RUN_ID): $title" -m "Drafted by Claude from the ticket; checked by seula G0 and G1."
          # Criterion 6: the token reaches only this step's git commands, not the git config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          # The branch belongs to this workflow; a re-run regenerates it.
          git_auth push --force -u origin "$branch"

          ticket_link="$(jq -r '.links.ticket // ""' "$RUN_FILE")"
          {
            echo "## Summary"
            echo
            if [ -n "$ticket_link" ]; then ticket_ref="[$TICKET_KEY]($ticket_link)"; else ticket_ref="$TICKET_KEY"; fi
            echo "Spec for $ticket_ref: \`$SPEC\`."
            jq -r '.structured_output.summary // ""' claude.json
            echo
            echo "Drafted by Claude from the ticket and checked by [seula](https://github.com/JJJohansson/seula) quality gates. **A person approves the spec and merges.**"
            if [ "$STATUS" = "review" ]; then
              # Criterion 8: unsure criteria are for the spec reviewer to decide.
              echo
              echo "## Needs your judgement"
              echo
              echo "G1 was unsure about these criteria. Read them, then keep, reword or remove each one before you approve the spec."
              echo
              jq -r '[.events[] | select(.gate == "G1")] | last | (.feedback // [])[] | select(test("→ review")) | "- " + .' "$RUN_FILE"
            elif [ "$STATUS" != "ready" ]; then
              echo
              echo "> **Draft: needs input ($STATUS).**"
              jq -r '(.structured_output.questions // [])[] | "> - " + .' claude.json
            fi
            echo
            echo "## Gate results"
            echo
            jq -r '.events[] | "- **\(.gate)** attempt \(.attempt): \(.result). \(.summary // "")", ((.feedback // [])[] | "  - \(.)")' "$RUN_FILE"
            echo
            jq -r '"Cost: Claude $\(.cost.claudeUsd * 100 | round / 100), Jev $\(.cost.jevUsd * 100000 | round / 100000)"' "$RUN_FILE"
            echo
            echo "## Checks"
            echo
            echo "- [x] seula G0 on the ticket"
            echo "- [x] seula G1 on the spec: format rules and Jev on every acceptance criterion (last result: $G1_RESULT)"
            echo "- [ ] The repo's own CI: runs on this pull request"
            echo "- [ ] A person has read the spec and set its status"
          } > pr-body.md

          # Criterion 8: ready for review on pass, or on unsure with no open questions (review).
          draft=()
          if [ "$STATUS" != "ready" ] && [ "$STATUS" != "review" ]; then draft=(--draft); fi
          if url="$(gh pr view "$branch" --json url -q .url 2>/dev/null)"; then
            gh pr edit "$branch" --body-file pr-body.md
            # An updated pull request follows this run's result, both ways.
            if [ "${#draft[@]}" -eq 0 ]; then
              gh pr ready "$branch" || echo "::warning::Could not mark the pull request ready"
            else
              gh pr ready "$branch" --undo || echo "::warning::Could not mark the pull request as a draft"
            fi
          else
            url="$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title "spec($RUN_ID): $title" --body-file pr-body.md "${draft[@]}")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          $SEULA update --run "$RUN_ID" --pr-url "$url"
          git add "$RUN_FILE"
          git commit -m "seula: link $RUN_ID to its pull request"
          git_auth push

      - name: Report on the ticket (criterion 9)
        if: steps.g0.outputs.code == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          STATUS: ${{ steps.result.outputs.status }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$STATUS" = "ready" ]; then
            printf 'seula · spec ready for review: %s\n\nG0 and G1 passed. Review the spec, set its status, and merge.\n' "$PR_URL" > comment.md
            state=specReview
          elif [ "$STATUS" = "review" ]; then
            # Criterion 9: unsure criteria go to the spec reviewer, not back to the ticket author.
            {
              printf 'seula · spec ready for review: %s\n\n' "$PR_URL"
              printf 'G1 passed the other criteria and was unsure about these. Decide on them in the spec review:\n'
              jq -r '[.events[] | select(.gate == "G1")] | last | (.feedback // [])[] | select(test("→ review")) | "- " + .' "$RUN_FILE" 2>/dev/null || true
            } > comment.md
            state=specReview
          else
            {
              printf 'seula · the spec needs input (%s). Draft pull request: %s\n\n' "$STATUS" "${PR_URL:-none}"
              jq -r '(.structured_output.questions // []) | map("- " + .) | join("\n")' claude.json 2>/dev/null || true
              # Criterion 9: what G1 (the workflow's own check, criterion 15) found in the criteria.
              feedback="$(jq -r '[.events[] | select(.gate == "G1")] | last | .feedback // [] | map("- " + .) | join("\n")' "$RUN_FILE" 2>/dev/null || true)"
              if [ -n "$feedback" ]; then printf '\n\nG1 found these criteria unclear or not testable:\n%s\n' "$feedback"; fi
            } > comment.md
            state=needsInput
          fi
          $SEULA tracker comment --tracker "$SEULA_TRACKER" --key "$TICKET_KEY" --text-file comment.md ||
            echo "::warning::Could not comment on the ticket"
          $SEULA tracker move --tracker "$SEULA_TRACKER" --key "$TICKET_KEY" --state "$state" ||
            echo "::warning::Could not set the ticket to $state"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ steps.result.outputs.status }}
        run: |
          {
            echo '```'
            $SEULA status 2>/dev/null || echo "No run file."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" = "blocked" ]; then
            echo "::error::The spec run is blocked; see the ticket and the run file."
            exit 1
          fi
