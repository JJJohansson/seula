# seula: turn a Jira ticket into a spec pull request.
# A Jira automation rule sends the repository_dispatch event when a ticket moves to
# "Ready for spec". Setup: https://github.com/JJJohansson/seula/blob/main/docs/setup-jira.md
name: seula · ticket to spec

on:
  repository_dispatch:
    types: [seula-ticket]

permissions:
  contents: read

jobs:
  seula:
    uses: JJJohansson/seula/.github/workflows/ticket-to-spec.yml@{{REF}}
    with:
      tracker: jira
      seula-ref: {{REF}}
    # Only the secrets seula uses, never `inherit`. seula's keys have their own names.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.SEULA_ANTHROPIC_API_KEY }}
      SEULA_GH_TOKEN: ${{ secrets.SEULA_GH_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.SEULA_TYPESAFE_API_KEY }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
